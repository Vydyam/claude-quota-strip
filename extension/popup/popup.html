<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Claude Token Tracker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="logo">⚡</span>
    <span class="title">Claude Quota Strip</span>
    <button id="btn-clear" title="Clear all sessions">Clear</button>
  </div>

  <div id="no-data" class="empty-state">
    <p>No sessions yet.</p>
    <p class="hint">Start a conversation on claude.ai</p>
  </div>

  <div id="sessions-list"></div>

  <div class="footer">
    <span class="footer-stat" id="footer-stat">—</span>
    <a href="https://github.com/Vydyam/claude-quota-strip" target="_blank">GitHub ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
